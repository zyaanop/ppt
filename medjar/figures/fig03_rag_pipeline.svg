e" font-weight="normal" font-style="normal">1</text><line x1="646.0" y1="241.0" x2="676.0" y2="241.0" stroke="#1B1B22" stroke-width="1.1"/><text x="661.0" y="256.0" font-family="Georgia, Palatino, serif" font-size="12" fill="#1B1B22" text-anchor="middle" font-weight="normal" font-style="normal">k + rank</text><text x="700.0" y="246.0" font-family="Georgia, Palatino, serif" font-size="11" fill="#1B1B22" text-anchor="start" font-weight="normal" font-style="normal">r (d)</text><text x="748.0" y="246.0" font-family="Georgia, Palatino, serif" font-size="13" fill="#1B1B22" text-anchor="start" font-weight="normal" font-style="normal">,   k ≈ 60</text><text x="40.0" y="40.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#6B6B76" text-anchor="start" font-weight="normal" font-style="normal">Corpus: versioned passages carrying source, section, publication year, evidence grade and specialty tags</text><text x="40.0" y="420.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#3F3F4A" text-anchor="start" font-weight="normal" font-style="normal">Only claims whose cited passage entails them may enter the debate; every surviving citation is written to the Evidence Ledger.</text><text x="40.0" y="444.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" fill="#A9A69C" text-anchor="start" font-weight="normal" font-style="normal" letter-spacing="0.12em">PROTOTYPE USES A HASHED BAG-OF-WORDS VECTOR SPACE AS A STAND-IN FOR A LEARNED MEDICAL EMBEDDING MODEL</text></svg>