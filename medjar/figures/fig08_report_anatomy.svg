reement</text><text x="80.0" y="446.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.2" fill="#6B6B76" text-anchor="start" font-weight="normal" font-style="normal">where specialists diverged</text><line x1="76.0" y1="476.0" x2="564.0" y2="476.0" stroke="#D8D4C8" stroke-width="1.0"/><text x="80.0" y="494.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1B1B22" text-anchor="start" font-weight="bold" font-style="normal">6 · Debate trajectory</text><text x="80.0" y="510.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.2" fill="#6B6B76" text-anchor="start" font-weight="normal" font-style="normal">D̄ per round, retrieval count</text><line x1="76.0" y1="524.0" x2="564.0" y2="524.0" stroke="#D8D4C8" stroke-width="1.0"/><text x="80.0" y="542.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#1B1B22" text-anchor="start" font-weight="bold" font-style="normal">7 · Next steps</text><text x="80.0" y="558.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.2" fill="#6B6B76" text-anchor="start" font-weight="normal" font-style="normal">discriminating investigations</text><line x1="76.0" y1="572.0" x2="564.0" y2="572.0" stroke="#D8D4C8" stroke-width="1.0"/><text x="80.0" y="590.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#2F6B3F" text-anchor="start" font-weight="bold" font-style="normal">8 · Audit trail</text><text x="80.0" y="606.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.2" fill="#6B6B76" text-anchor="start" font-weight="normal" font-style="normal">Evidence Ledger, replayable</text><line x1="584.0" y1="68.0" x2="626.0" y2="68.0" stroke="#8A1524" stroke-width="1.1" stroke-dasharray="3 3"/><text x="634.0" y="72.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" fill="#8A1524" text-anchor="start" font-weight="normal" font-style="normal">leads 